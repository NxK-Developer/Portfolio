# Deploys the static export (out/) to GitHub Pages.
#
# Setup (one time, in the repo):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The build has no server dependency: `output: "export"` in next.config.ts
# emits plain HTML/CSS/JS into out/, which is uploaded as a Pages artifact
# and served from the repository subpath (basePath: /Portfolio).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          # Keep defaults unless a repo Variable is set:
          #   NEXT_PUBLIC_BASE_PATH — deploy to a different subpath or "/" for a
          #                            user/org site (repo Variables → repository).
          #   NEXT_PUBLIC_SITE_URL — canonical/OG origin for a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/Portfolio' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `next build` with output:"export" writes the static site here
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
